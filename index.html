function createMutant(type,mutation=null){
 const t=TYPES[type],g=new THREE.Group(),body=mat(t.color,t.color),dark=mat(0x19283b),belly=mat(0xd4f8cb),eye=mat(0x07111e),shine=mat(0xffffff);

}
const WEATHER=[{name:'Orage électrique',icon:'⚡',color:0x6b92ff,mutation:'Électrique'},{name:'Pluie toxique',icon:'☣️',color:0x77fa75,mutation:'Toxique'},{name:'Blizzard',icon:'❄️',color:0xb4e9ff,mutation:'Glaciale'},{name:'Tempête solaire',icon:'☀️',color:0xffb45d,mutation:'Solaire'}];

function weatherUpdate(){const now=new Date(),hour=now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate()+'-'+now.getHours(),minute=now.getMinutes(),seconds=now.getSeconds(),active=minute<5;let idx=(Math.floor(now.getTime()/3600000)%WEATHER.length+WEATHER.length)%WEATHER.length;
 const el=document.getElementById('weather');if(active){currentEvent=idx;const w=WEATHER[idx];el.innerHTML=w.icon+' '+w.name+'<small>Fin dans '+String(4-minute).padStart(2,'0')+':'+String(59-seconds).padStart(2,'0')+'</small>';scene.background.setHex(w.color).lerp(new THREE.Color(0x0b1428),.72);if(lastEventHour!==hour){lastEventHour=hour;notify(w.icon+' '+w.name+' : chance de mutation !')}

let axisX=0,axisY=0,active=null;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joyMove(e){if(active!==e.pointerId)return;const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),f=Math.min(l,39)/(l||1);axisX=dx*f/39;axisY=dy*f/39;stick.style.transform=`translate(${dx*f}px,${dy*f}px)`}joy.addEventListener('pointerdown',e=>{active=e.pointerId;joy.setPointerCapture(active);joyMove(e)});joy.addEventListener('pointermove',joyMove);function end(e){if(e.pointerId!==active)return;active=null;axisX=axisY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);

let last=performance.now(),saveTimer=0,shown=false;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;const x=axisX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=axisY+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(x,z)||1;const mx=(x*Math.cos(camYaw)+z*Math.sin(camYaw))/len,mz=(z*Math.cos(camYaw)-x*Math.sin(camYaw))/len;player.position.x=THREE.MathUtils.clamp(player.position.x+mx*5.1*dt,-11.2,11.2);player.position.z=THREE.MathUtils.clamp(player.position.z+mz*5.1*dt,-11.2,11.2);if(Math.abs(x)+Math.abs(z)>.1)player.rotation.y=Math.atan2(mx,mz);velocityY-=15*dt;player.position.y=Math.max(0,player.position.y+velocityY*dt);if(player.position.y===0)velocityY=0;mutants.forEach(m=>{m.g.position.y=0;m.g.rotation.y=Math.sin(now*.001+m.phase)*.25;m.g.rotation.z=Math.sin(now*.002+m.phase)*.025;m.legs.forEach((leg,i)=>{leg.rotation.x=Math.sin(now*.003+m.phase+i*Math.PI)*.22})});credits+=income()*dt;update();saveTimer+=dt;if(saveTimer>1){weatherUpdate();saveTimer=0;save()}const distance=8.5,cp=Math.cos(camPitch);const target=new THREE.Vector3(player.position.x+Math.sin(camYaw)*distance*cp,player.position.y+2.6+Math.sin(camPitch)*distance,player.position.z+Math.cos(camYaw)*distance*cp);camera.position.lerp(target,Math.min(1,dt*9));camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);if(!shown&&Math.hypot(player.position.x,player.position.z+5)<3){shown=true;notify('Capsule de mutation découverte !')}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});weatherUpdate();renderShop();notify('Bienvenue dans PROJECT MUTATION !');

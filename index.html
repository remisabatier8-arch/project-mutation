<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d1b"><title>Project Mutation — Prototype 3D</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#080d1b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:14px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}#hud strong{font-size:17px}#hud small{display:block;color:#a3f4d4}#coins{background:#101e31df;border:1px solid #4cd8ac77;border-radius:14px;padding:10px 14px}#joy{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:25px;width:130px;height:130px;border-radius:50%;background:#c9eaff20;border:2px solid #c9eaff70;touch-action:none}#stick{position:absolute;width:58px;height:58px;left:34px;top:34px;border-radius:50%;background:#6af2c9a8;border:2px solid #c4ffe8}#actions{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));right:20px;display:flex;flex-direction:column;gap:12px}button{border:1px solid #7cf8c8;background:#14483d;color:white;font-size:15px;font-weight:800;border-radius:18px;padding:15px 18px;box-shadow:0 4px 20px #0007}button:disabled{opacity:.5}#message{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:#0c2035e8;border:1px solid #61e4c0;border-radius:14px;padding:12px 16px;max-width:85vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}#intro{position:absolute;left:12px;right:12px;bottom:calc(180px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#e0e8ffcc;pointer-events:none}#error{position:absolute;top:38%;left:8%;width:84%;text-align:center;color:#fff;background:#18273d;padding:20px;border-radius:15px;display:none}#shop{position:absolute;right:10px;top:92px;width:min(310px,86vw);max-height:58vh;overflow:auto;background:#101b31ee;border:1px solid #4be7b9;border-radius:17px;padding:12px;display:none;box-shadow:0 10px 35px #000a}#shop.open{display:block}.shoprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0;padding:7px;background:#ffffff10;border-radius:10px}.shoprow button{padding:9px;font-size:12px}.shoprow small{display:block;color:#9ddccf}#toggle{position:absolute;right:12px;top:calc(64px + env(safe-area-inset-top));padding:10px 13px;background:#173e58}#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;font-size:11px;color:#d8eeff;pointer-events:none;white-space:nowrap}#actions{bottom:calc(48px + env(safe-area-inset-bottom))}#jump{background:#29579a}#buy{display:none}@media(max-width:430px){#hud strong{font-size:13px}#coins{padding:7px}#joy{width:118px;height:118px}#stick{left:29px;top:29px}} </style></head><body><div id="hud"><div><strong>🧬 PROJECT MUTATION</strong><small>Laboratoire • Prototype 3D</small></div><div id="coins">🪙 <span id="money">100</span><small>+<span id="rate">0</span>/s</small></div></div><div id="message"></div><div id="joy"><div id="stick"></div></div><div id="actions"><button id="buy">Créer</button><button id="jump">⬆ Sauter</button></div><button id="toggle">🧬 Boutique / Évolutions</button><div id="shop"><strong>🧬 LABORATOIRE</strong><div id="items"></div><button id="close">Fermer</button></div><div id="hint">Joystick gauche · Glisser à droite : caméra · Sauter en courant</div><div id="error">Impossible de charger le moteur 3D. Ouvre ce fichier dans Safari avec une connexion Internet.</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1428);scene.fog=new THREE.Fog(0x0b1428,18,44);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb7d9ff,0x1c2631,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(5,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
function mat(c,em=0){return new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.15,emissive:em,emissiveIntensity:em?.24:0})}function cube(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;o.castShadow=true;parent.add(o);return o}function ball(r,m,x,y,z,parent=scene,s=1){const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.position.set(x,y,z);o.scale.set(1,s,1);o.castShadow=true;parent.add(o);return o}
const floor=mat(0x19263a),wall=mat(0x27344d),neon=mat(0x49f6b8,0x49f6b8);cube(25,.3,25,floor,0,-.2,0);for(let i=-12;i<=12;i+=2){cube(.035,.012,25,mat(0x294057),i,-.035,0);cube(25,.012,.035,mat(0x294057),0,-.035,i)}for(const x of [-12.5,12.5])cube(.5,5,25,wall,x,2.3,0);cube(25,5,.5,wall,0,2.3,-12.5);for(let i=-9;i<=9;i+=6){cube(.22,4,.22,neon,i,2,-12.15);cube(.22,4,.22,neon,-12.15,2,i)}
const platform=mat(0x385c61),glass=new THREE.MeshStandardMaterial({color:0x78f8cf,transparent:true,opacity:.22,metalness:.1,roughness:.12,side:THREE.DoubleSide});cube(3,.6,3,platform,0,.3,-5);const pod=new THREE.Mesh(new THREE.CylinderGeometry(1,1,2.8,24,1,true),glass);pod.position.set(0,2,-5);scene.add(pod);const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.07,8,30),neon);ring.rotation.x=Math.PI/2;ring.position.set(0,3.4,-5);scene.add(ring);ball(.52,mat(0x72ff9c,0x2dff76),0,1.65,-5,scene,.82);
const player=new THREE.Group();scene.add(player);const suit=mat(0x4d92e8),skin=mat(0xffd3ad),black=mat(0x152031);cube(.72,1,.38,suit,0,1.15,0,player);ball(.39,skin,0,1.94,0,player);cube(.21,.8,.24,suit,-.55,1.14,0,player);cube(.21,.8,.24,suit,.55,1.14,0,player);cube(.24,.65,.29,black,-.23,.35,0,player);cube(.24,.65,.29,black,.23,.35,0,player);player.position.set(0,0,5);
const TYPES=[{name:'Blobix',price:50,rate:2,color:0x6bfa83},{name:'Toxipod',price:350,rate:12,color:0x42d5e8},{name:'Voltazor',price:1800,rate:55,color:0x9a6cff},{name:'Mutant X',price:8500,rate:230,color:0xffa447},{name:'Omega Prime',price:40000,rate:1100,color:0xff5eae}];
const mutants=[];let credits=100,level=1,boost=1,vertical=0,velocityY=0,camYaw=0,camPitch=.3;const money=document.getElementById('money'),rate=document.getElementById('rate'),msg=document.getElementById('message');
function notify(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(notify.t);notify.t=setTimeout(()=>msg.style.opacity=0,2000)}
function createMutant(type){const t=TYPES[type],g=new THREE.Group(),body=mat(t.color,t.color),eye=mat(0x10192b),shine=mat(0xffffff);ball(.47+type*.09,body,0,.58+type*.07,0,g,.85);for(const side of [-1,1]){ball(.15,body,side*.38,.19,.13,g);ball(.14,eye,side*.21,.68+type*.07,.39+type*.035,g);ball(.045,shine,side*.21-.02,.73+type*.07,.50+type*.035,g);if(type>0){const horn=new THREE.Mesh(new THREE.ConeGeometry(.13,.35+type*.08,7),body);horn.position.set(side*.33,1.02+type*.13,0);g.add(horn)}}const i=mutants.length;g.position.set(-7+(i%8)*2,0,-2+Math.floor(i/8)*2.2);scene.add(g);mutants.push({g,type,phase:Math.random()*6});}
function income(){return mutants.reduce((a,m)=>a+TYPES[m.type].rate,0)*boost}
function save(){try{localStorage.setItem('projectMutationV2',JSON.stringify({credits,level,boost,types:mutants.map(m=>m.type)}))}catch(e){}}
try{const old=JSON.parse(localStorage.getItem('projectMutationV2')||'null');if(old){credits=Number(old.credits)||100;level=old.level||1;boost=old.boost||1;(old.types||[]).slice(0,32).forEach(createMutant)}}catch(e){}
function update(){money.textContent=Math.floor(credits).toLocaleString('fr-FR');rate.textContent=income().toLocaleString('fr-FR')}
const items=document.getElementById('items');function renderShop(){items.innerHTML='';TYPES.forEach((t,i)=>{const unlocked=i<level;const row=document.createElement('div');row.className='shoprow';row.innerHTML='<div><b>'+t.name+'</b><small>+'+(t.rate*boost)+'/s · '+(unlocked?t.price.toLocaleString('fr-FR')+' 🪙':'Niveau '+(i+1)+' requis')+'</small></div>';const btn=document.createElement('button');btn.textContent=unlocked?'Créer':'🔒';btn.disabled=!unlocked||credits<t.price||mutants.length>=32;btn.onclick=()=>{if(credits<t.price)return;credits-=t.price;createMutant(i);save();update();renderShop();notify('✨ '+t.name+' créé !')};row.append(btn);items.append(row)});const upgrade=document.createElement('div');upgrade.className='shoprow';const cost=200*level*level;upgrade.innerHTML='<div><b>🔬 Laboratoire niveau '+level+'</b><small>Débloque le prochain mutant · '+cost.toLocaleString('fr-FR')+' 🪙</small></div>';const b=document.createElement('button');b.textContent='Améliorer';b.disabled=level>=5||credits<cost;b.onclick=()=>{credits-=cost;level++;save();update();renderShop();notify('Niveau '+level+' débloqué !')};upgrade.append(b);items.append(upgrade);const prod=document.createElement('div');prod.className='shoprow';const pc=500*boost*boost;prod.innerHTML='<div><b>⚡ Production x'+boost+'</b><small>Augmente tous les revenus · '+pc.toLocaleString('fr-FR')+' 🪙</small></div>';const pb=document.createElement('button');pb.textContent='Améliorer';pb.disabled=credits<pc||boost>=10;pb.onclick=()=>{credits-=pc;boost++;save();update();renderShop();notify('Production x'+boost)};prod.append(pb);items.append(prod)}
document.getElementById('toggle').onclick=()=>{document.getElementById('shop').classList.toggle('open');renderShop()};document.getElementById('close').onclick=()=>document.getElementById('shop').classList.remove('open');
let axisX=0,axisY=0,active=null;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joyMove(e){if(active!==e.pointerId)return;const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),f=Math.min(l,39)/(l||1);axisX=dx*f/39;axisY=dy*f/39;stick.style.transform=`translate(${dx*f}px,${dy*f}px)`}joy.addEventListener('pointerdown',e=>{active=e.pointerId;joy.setPointerCapture(active);joyMove(e)});joy.addEventListener('pointermove',joyMove);function end(e){if(e.pointerId!==active)return;active=null;axisX=axisY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
function jump(){if(player.position.y<.02)velocityY=6.7}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.35||lookId!==null)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(lookId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;camYaw-=(e.clientX-lastX)*.007;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-lastY)*.005,-.28,1.05);lastX=e.clientX;lastY=e.clientY});for(const ev of ['pointerup','pointercancel'])renderer.domElement.addEventListener(ev,e=>{if(e.pointerId===lookId)lookId=null});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
// Extra scene decoration and dynamic colored lighting.
for(let i=0;i<9;i++){const x=-10+(i%5)*5,z=-9+Math.floor(i/5)*17;cube(1.6,.35,1.6,mat(0x31556c),x,.05,z);const lamp=new THREE.PointLight(i%2?0x47baff:0x52ffc1,2.3,7);lamp.position.set(x,2.5,z);scene.add(lamp);const pole=cube(.12,2,.12,neon,x,1,z);pole.castShadow=false}
for(let i=0;i<6;i++){const x=-9+i*3.5;cube(1.5,.5,.7,mat(0x355777),x,.5,-10.8);cube(1.25,.08,.1,neon,x,.85,-10.3)}
let last=performance.now(),saveTimer=0,shown=false;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;const x=axisX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=axisY+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(x,z)||1;const mx=(x*Math.cos(camYaw)+z*Math.sin(camYaw))/len,mz=(z*Math.cos(camYaw)-x*Math.sin(camYaw))/len;player.position.x=THREE.MathUtils.clamp(player.position.x+mx*5.1*dt,-11.2,11.2);player.position.z=THREE.MathUtils.clamp(player.position.z+mz*5.1*dt,-11.2,11.2);if(Math.abs(x)+Math.abs(z)>.1)player.rotation.y=Math.atan2(mx,mz);velocityY-=15*dt;player.position.y=Math.max(0,player.position.y+velocityY*dt);if(player.position.y===0)velocityY=0;mutants.forEach(m=>{m.g.position.y=Math.sin(now*.003+m.phase)*.12;m.g.rotation.y=Math.sin(now*.001+m.phase)*.35});credits+=income()*dt;update();saveTimer+=dt;if(saveTimer>5){saveTimer=0;save()}const distance=8.5,cp=Math.cos(camPitch);const target=new THREE.Vector3(player.position.x+Math.sin(camYaw)*distance*cp,player.position.y+2.6+Math.sin(camPitch)*distance,player.position.z+Math.cos(camYaw)*distance*cp);camera.position.lerp(target,Math.min(1,dt*9));camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);if(!shown&&Math.hypot(player.position.x,player.position.z+5)<3){shown=true;notify('Capsule de mutation découverte !')}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderShop();notify('Bienvenue dans PROJECT MUTATION !');
